<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Career Charts — 節奏格擋（全螢幕）</title>
  <link rel="stylesheet" href="career-charts.css" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07090e;
      color: #e8ecf4;
      font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
    }
    /* Full viewport mount — chart IS the screen */
    #mount {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    #log {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      margin: 0;
      padding: 6px 14px;
      border: 1px solid #2a3344;
      border-radius: 999px;
      background: rgba(8, 10, 16, 0.75);
      font-size: 11px;
      color: #8b95a8;
      pointer-events: none;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #log strong { color: #e8ecf4; }
  </style>
</head>
<body>
  <div id="mount"></div>
  <div id="log">選譜面 · Start · Perfect ±40ms · Good ±100ms · Space／點擊</div>

  <script type="module">
    import './chart-engine.js';

    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'career-charts.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('career-charts.js failed'));
      document.head.appendChild(s);
    });

    const log = document.getElementById('log');
    CareerCharts.mountDemo(document.getElementById('mount'), {
      type: 'punch',
      onComplete(result) {
        const pct = Math.round(result.accuracy * 100);
        log.innerHTML =
          '完成 · judgment=<strong>' + result.judgment +
          '</strong> · accuracy=<strong>' + pct + '%</strong>' +
          ' · P' + result.tallies.perfect +
          ' G' + result.tallies.good +
          ' M' + result.tallies.miss +
          ' · max combo ' + result.comboMax;
      },
    });
  </script>
</body>
</html>
